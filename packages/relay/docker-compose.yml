services:
  relay:
    build: .
    volumes:
      - relay-data:/app/data
    environment:
      - PORT=3000
      - RELAY_HOST=${RELAY_HOST:-localhost}
      - DATABASE_URL=file:/app/data/connectclaw.db
      - RELAY_ACCESS_TOKEN=${RELAY_ACCESS_TOKEN:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
    restart: unless-stopped
    profiles:
      - ssl

volumes:
  relay-data:
  caddy-data:
  caddy-config:
